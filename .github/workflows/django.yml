name: CI - Recicash

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: recicash_db
          POSTGRES_USER: recicash_user
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install System Dependencies (GDAL/PostGIS libs)
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # O requirements.txt está na raiz de backend/
        pip install -r backend/requirements.txt

    - name: Run Tests
      env:
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DB_ENGINE: 'django.contrib.gis.db.backends.postgis'
        DB_NAME: 'recicash_db'
        DB_USER: 'recicash_user'
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: 'localhost'
        DB_PORT: '5432'
      run: |
        cd backend/src
        python manage.py test ../tests
